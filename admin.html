<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel · Syllabus Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./admin.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- LOGIN -->
  <div id="auth-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">ST</div>
        <div>
          <div class="login-title">Admin Panel</div>
          <div class="login-sub">Syllabus Tracker · Control Center</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="a-email" class="form-input" placeholder="admin@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="a-pass" class="form-input" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div id="a-error" class="login-error" style="display:none"></div>
      <button id="a-btn" class="btn btn-primary w-full">Sign In</button>
      <div class="login-note">Access restricted to authorized admins only.</div>
    </div>
  </div>

  <!-- ADMIN APP -->
  <div id="app" style="display:none">

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-icon">ST</div>
          <span class="brand-name">Admin</span>
        </div>
        <button id="sidebar-close" class="icon-btn sidebar-close-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="admin-profile">
          <div class="admin-av" id="admin-av">A</div>
          <div class="admin-meta">
            <div class="admin-name" id="admin-name">Admin</div>
            <div class="admin-role" id="admin-role">—</div>
          </div>
        </div>
        <button id="logout-btn" class="icon-btn logout-btn" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Mobile sidebar backdrop -->
    <div id="sidebar-bd" class="sidebar-backdrop"></div>

    <!-- Main content -->
    <div class="main-wrap">
      <header class="topbar">
        <button id="mob-menu" class="icon-btn mob-only">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div id="page-title" class="page-title">Dashboard</div>
        <div class="topbar-right">
          <div id="conn-dot" class="conn-dot" title="Firebase connection"></div>
          <button id="refresh-btn" class="icon-btn" title="Refresh">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
        </div>
      </header>
      <main id="page-content" class="page-content"></main>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal" style="display:none">
    <div class="modal-bd" id="modal-bd"></div>
    <div class="modal-box" id="modal-box">
      <div class="modal-hdr">
        <div class="modal-ttl" id="modal-ttl">Dialog</div>
        <button class="icon-btn" id="modal-cls">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-foot" class="modal-foot"></div>
    </div>
  </div>

  <!-- TOASTS -->
  <div id="toasts"></div>

  <script src="./admin.js"></script>
</body>
</html>
