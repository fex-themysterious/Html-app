<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- ✅ FIXED: zoom allow + better responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#0f172a" />
  <title>Syllabus Tracker</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div id="app">

    <!-- SETTINGS BUTTON -->
    <button id="settings-btn" class="settings-btn" aria-label="Settings">
      ⚙️
    </button>

    <!-- VIEWS -->
    <main id="view-home" class="view active"></main>
    <main id="view-dashboard" class="view"></main>
    <main id="view-syllabus" class="view"></main>

    <!-- ❌ REMOVED calendar -->
    <!-- <main id="view-calendar" class="view"></main> -->

    <main id="view-revision" class="view"></main>
    <main id="view-stats" class="view"></main>

    <!-- ✅ NEW: Focus tab -->
    <main id="view-focus" class="view"></main>

    <!-- NAVBAR -->
    <nav class="bottom-nav">

      <button class="nav-btn active" data-tab="home">
        <span>Home</span>
      </button>

      <button class="nav-btn" data-tab="dashboard">
        <span>Dashboard</span>
      </button>

      <button class="nav-btn" data-tab="syllabus">
        <span>Syllabus</span>
      </button>

      <!-- ❌ REMOVED calendar -->
      <!-- <button class="nav-btn" data-tab="calendar"> -->

      <!-- ✅ NEW Focus -->
      <button class="nav-btn" data-tab="focus">
        <span>Focus</span>
      </button>

      <button class="nav-btn" data-tab="revision">
        <span>Revision</span>
      </button>

      <button class="nav-btn" data-tab="stats">
        <span>Stats</span>
      </button>

    </nav>

    <!-- MODAL + TOAST -->
    <div id="modal-root"></div>
    <div id="toast-container"></div>

  </div>

  <!-- SERVICE WORKER -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

  <script src="script.js"></script>
</body>
</html>
