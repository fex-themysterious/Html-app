  <meta name="apple-mobile-web-app-title" content="Study"/>
  <meta name="apple-mobile-web-app-orientations" content="portrait"/>

<body>
  <div id="app">

    </button>

    <main id="view-home"      class="view active"></main>
    <main id="view-dashboard" class="view"></main>
    <main id="view-syllabus"  class="view"></main>
    <main id="view-focus"     class="view"></main>
    <main id="view-social"    class="view"></main>
    <main id="view-shop"      class="view"></main>
    <main id="view-stats"     class="view"></main>

    <nav class="bottom-nav" role="tablist" aria-label="Main navigation">
      <button class="nav-btn active" data-tab="home" role="tab" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-tab="dashboard" role="tab" aria-label="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span>Dash</span>
      </button>
      <button class="nav-btn" data-tab="syllabus" role="tab" aria-label="Syllabus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Study</span>
      </button>
      <button class="nav-btn" data-tab="focus" role="tab" aria-label="Focus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M4.5 3.5l1.5 1.5"/><path d="M17.5 3.5l-1.5 1.5"/><line x1="12" y1="2" x2="12" y2="4"/></svg>
        <span>Focus</span>
      </button>
      <button class="nav-btn" data-tab="social" role="tab" aria-label="Social">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Social</span>
      </button>
      <button class="nav-btn" data-tab="stats" role="tab" aria-label="Stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Stats</span>

    <div id="modal-root"></div>
    <div id="toast-container" aria-live="polite" aria-atomic="false"></div>
    <div id="lock-overlay" class="lock-overlay hidden"></div>
  </div>

  <!-- ── Cloud Sync / Restore Overlay (blocks UI until data is loaded) ── -->
  <div id="sync-overlay" class="sync-overlay hidden" role="status" aria-label="Restoring data" aria-live="polite">
    <div class="sync-overlay-card">
      <div class="sync-spinner"><div class="sync-spinner-ring"></div></div>
      <p class="sync-msg" id="sync-msg">Restoring your study data…</p>
      <p class="sync-sub" id="sync-sub">Please wait, do not close the app</p>
    </div>
  </div>

  <!-- ── Firebase Auth Overlay ────────────────────────────────────────── -->
  <div id="auth-overlay" class="auth-overlay hidden auth-loading" role="dialog" aria-modal="true" aria-label="Sign in">
    <canvas id="auth-particles" class="auth-particles-canvas"></canvas>
    <div class="auth-card">
      <div class="auth-glow-ring"></div>
      <div class="auth-logo">📚</div>
      <h2 class="auth-title">Study Hub</h2>
      <p class="auth-subtitle" id="auth-subtitle">Sign in to sync your progress</p>
      <div id="auth-error" class="auth-error hidden"></div>
      <!-- Spinner shown while Firebase is initialising -->
      <div id="auth-spinner" class="auth-spinner" aria-label="Connecting…">
        <div class="auth-spinner-ring"></div>
        <p class="auth-spinner-label">Connecting…</p>
      </div>
      <form id="auth-form" class="auth-fields" autocomplete="on" onsubmit="return false">
        <input type="email"    id="auth-email"    class="auth-input" placeholder="Email address"  autocomplete="email"/>
        <input type="password" id="auth-password" class="auth-input" placeholder="Password"       autocomplete="current-password"/>
        <div class="auth-forgot-row">
          <button type="button" class="auth-forgot-btn" data-act="auth-forgot">Forgot Password?</button>
        </div>
        <button class="auth-btn auth-btn-primary" id="auth-submit" data-act="auth-submit" type="button">Sign In</button>
      </form>
      <div class="auth-toggle">
        <span id="auth-toggle-text">Don't have an account?</span>
        <button class="auth-toggle-btn" data-act="auth-toggle-form" id="auth-toggle-btn">Sign Up</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="./offline-sync.js?v=1"></script>
  <script src="./sync-engine.js?v=1"></script>
  <script src="./script.js?v=212"></script>
  <script src="./social.js?v=37"></script>
  <script src="./duel.js?v=3"></script>
  <script>
    /* ── Prevent pinch-zoom on iOS (gesture events) ── */
    document.addEventListener('gesturestart',  function(e){ e.preventDefault(); }, {passive: false});
    document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive: false});
    document.addEventListener('gestureend',   function(e){ e.preventDefault(); }, {passive: false});
    /* ── Service Worker + Auto-Update ── */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Guard: only reload once per update cycle (prevents double-reload)
        let _swUpdating = false;

        navigator.serviceWorker.register('/sw.js').then(reg => {
          // Force-check for a new SW version on every page load
          reg.update().catch(() => {});

          // When a new SW is found installing, watch it activate
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              // 'installed' = new SW ready, existing controller = real update (not first install)
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // SW has skipWaiting() so it will activate immediately — nothing to do here;
                // controllerchange below will handle the reload
              }
            });
          });
        }).catch(() => {});

        // Primary reload trigger: fires when the new SW claims this page
        // This is the most reliable signal that fresh files are now active
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (_swUpdating) return;   // already reloading — ignore duplicate events
          _swUpdating = true;
          window.location.reload();
        });
      });
    }

    /* ── Orientation lock to portrait (Screen Orientation API + iOS fallback) ──
       The app is portrait-by-default. Individual sections (Full Focus, Video
       Player) call screen.orientation.lock('landscape') via their own toggle.
       On exit from those sections the app calls lock('portrait') to restore.  */
    (function () {
      function lockPortrait() {
        try {
          if (screen.orientation && typeof screen.orientation.lock === 'function') {
            screen.orientation.lock('portrait').catch(function () {});
          }
        } catch (e) {}
      }

      /* Lock portrait immediately and reinforce after first user gesture */
      lockPortrait();
      document.addEventListener('click',      lockPortrait, { once: true });
      document.addEventListener('touchstart', lockPortrait, { once: true });

      /* iOS / Safari: viewport height doesn't update on rotation.
         Force a style recalc so dvh/svh values refresh. */
      function onOrientationChange() {
        /* Short delay lets the browser finish resizing */
        setTimeout(function () {
          var vh = window.innerHeight * 0.01;
          document.documentElement.style.setProperty('--real-vh', vh + 'px');
          /* Nudge body to flush any cached layout */
          document.body.style.minHeight = window.innerHeight + 'px';
          requestAnimationFrame(function () {
            document.body.style.minHeight = '';
          });
        }, 150);
      }

      window.addEventListener('orientationchange', onOrientationChange);
      window.addEventListener('resize', onOrientationChange);
      onOrientationChange(); /* run once on load */
    })();
  </script>
</body>
</html>
